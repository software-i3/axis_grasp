# Which sensor produces the range image the voting stage runs on.
#   disparity  a 32FC1/64FC1 pixel-disparity image on `disparity_topic`, used as
#              published.
#   depth      a bx_msgs/DepthImage metric depth map on `depth_topic`,
#              converted to pixel disparity on arrival with
#              d = fx * baseline / Z. The payload is either a uint16 PNG in
#              millimetres or a float32 map in metres; the decoded image type
#              decides which, so the unit is never guessed. Needs a build with
#              bx_msgs (-DAXIS_GRASP_WITH_DETECTIONS=ON, the default). Both
#              inputs encode the same geometry, so the voting and grasp stages
#              are unchanged; what does change is the frame's resolution, which
#              is now the depth image's.
input_kind: depth

disparity_topic: no
# Only used when input_kind is `depth`. Exactly one of the two range topics is
# subscribed.
depth_topic: /ikan/explore3d/depth_image
# bx_msgs/DepthImage carries no std_msgs/Header, so there is no frame id to
# inherit. Empty keeps the "camera" fallback.
depth_frame_id: "ikan/camera_link"
# Depths outside this band are treated as holes, as a 0 mm sample already is.
# The lower bound is the one that matters by default: a near-field sample
# converts to a huge disparity and would vote as a large close object. The upper
# bound rejects far-away readings whose disparity is at the noise floor. Note
# that a uint16-millimetre payload tops out at 65.535 m, so the default 100 m
# ceiling only ever takes effect if it is lowered -- or if the payload is float
# metres, where it is an ordinary range to exceed. Either way a frame that is
# entirely holes is logged, which is also what a payload read in the wrong unit
# looks like.
depth_min_m: 0.05
depth_max_m: 100.0

label_topic: /label
output_topic: /grasp_poses_by_pipeline
sync_slop_seconds: 0.03
# Grace period, measured on a local steady clock, that a disparity waits for a
# usable ROI before it is processed over the whole frame instead. Applies to
# either label_source, so the node always publishes whether or not a label or
# detections topic is present. Set to 0 for fallback after the first
# callback-processing pass.
mask_wait_timeout_seconds: 0.10

# Where the ROI mask comes from.
#   mask        a mono8 label image on `label_topic`, co-published with the
#               disparity frame.
#   detections  polygon contours from bx_msgs/DetectedInstances on
#               `detections_topic`, rasterized onto the disparity resolution.
label_source: mask

# Only used when label_source is `detections`.
detections_topic: /ikan/vision/ml/detections
# Several detectors share that topic (sim_sonar_seg, sim_front_cam_seg), so set
# this to the one whose contours should become the ROI. Empty accepts any.
detector_name: ""
# Accepted DetectedInstance.name values. Empty accepts every class.
detection_classes: []
# DetectedInstance.confidence is a percentage where 0 means "not available",
# so 0 accepts everything.
min_confidence: 0

native_width: 1600
native_height: 1200
strategy: camera
enable_roi_crop: true
roi_crop_padding: -1
r_min: 2
r_max: 14
magnitude_percentile: 70.0
direction_bins: 8
# Drop straight-line components (rope, cable) from the coherent vote
# accumulator before component filtering. This is the rope on/off switch: with
# `false` the rope survives into voting and grasp proposal. Override per launch
# with `remove_straight_rope:=true|false`.
remove_straight_rope: true
bilateral_diameter: 9
bilateral_sigma_color: 75.0
bilateral_sigma_space: 75.0
accumulator_percentile: 30.0
close_kernel: 9
top_components: 2
spacing_m: 0.001
dense_spacing_pixels: 3.5
edge_margin_pixels: 6
post_skeleton_dilation_pixels: 2
ransac_distance_m: 0.005
ransac_iterations: 50
ransac_min_inliers: 5
ransac_min_inlier_fraction: 0.3
ransac_seed: 0

